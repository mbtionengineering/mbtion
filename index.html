<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmson Solar Navbar</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <nav class="navbar navbar-expand-lg container-fluid">

        <div class="container-fluid navbar-inner">

            <!-- Logo -->
            <a href="#" class="navbar-brand brand" aria-label="Farmson Solar Home">
                <img src="/images/Web-logo.PNG" alt="Farmson Solar">
            </a>

            <!-- Bootstrap Mobile Toggle -->
            <button
                class="navbar-toggler menu-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navigation Area -->
            <div class="collapse navbar-collapse nav-area" id="mainNavbar">

                <!-- Navigation Links -->
                <ul class="navbar-nav nav-links align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">HOME</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#overview">OVERVIEW</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#products">PRODUCTS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#gallery">GALLERY</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#clients">CLIENT LIST</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">CONTACT US</a>
                    </li>

                </ul>


                <!-- Buttons -->
                <div class="nav-actions">

                    <a href="#quote" class="btn btn-quote">
                        <span class="icon">✉</span>
                        Get Free Quote
                    </a>

                    <a href="#dealership" class="btn btn-dealership">
                        Get Dealership
                    </a>

                </div>


                <!-- Phone -->
                <a href="tel:18002741777" class="phone">

                    <span class="phone-icon">☎</span>

                    <span class="phone-text">
                        <small>Toll Free:</small>
                        <strong>1800 274 1777</strong>
                    </span>

                </a>

            </div>

        </div>

    </nav>

</header>

<!-- Carousal Start -->

<div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/images/rooftop_demo.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="/images/banner_1.jpg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="/images/banner_1.jpg"class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

 <!-- Carousal End -->


<!-- Bootstrap 5 JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
